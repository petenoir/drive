<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Drive</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>☁ My Drive</h1>
        <p class="subtitle">
            Upload files and share them anywhere
        </p>

        <div class="upload-card">

            <input
                type="file"
                id="fileInput">

            <button
                id="uploadBtn"
                onclick="uploadFile()">

                Upload File

            </button>

            <div id="status"></div>

        </div>

        <h2>Recent Uploads</h2>

        <div id="fileList">

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
